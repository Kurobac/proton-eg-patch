name: Build patched Proton

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8AM UTC
  workflow_dispatch:
    inputs:
      ge_tag:
        description: 'GE-Proton tag (e.g. GE-Proton11-14)'
        required: false
        type: string
      wine_commit:
        description: 'Expected Wine commit SHA (optional)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check_release:
    runs-on: ubuntu-24.04
    outputs:
      ge_tag: ${{ steps.target.outputs.tag }}
      release_tag: ${{ steps.target.outputs.tag_name }}
      release_exists: ${{ steps.release.outputs.exists }}

    steps:
      - name: Determine build target
        id: target
        env:
          GE_TAG_INPUT: ${{ github.event.inputs.ge_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GE_TAG_INPUT" ]; then
            tag="$GE_TAG_INPUT"
            echo "tag=$GE_TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            # Fetch latest GE-Proton release tag
            tag=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Latest GE-Proton: $tag"
          fi
          echo "tag_name=$(echo "$tag" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          response_file="$RUNNER_TEMP/release-response.json"
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")

          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG already exists; skipping build."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG does not exist; continuing build."
              ;;
            *)
              echo "GitHub API returned HTTP $status while checking $RELEASE_TAG." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

  build:
    needs: check_release
    if: needs.check_release.outputs.release_exists == 'false'
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 60

    steps:
      - name: Update apt index
        timeout-minutes: 3
        run: |
          apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

      - name: Install build dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget xz-utils build-essential pkg-config \
            flex bison autoconf automake libtool python3 gcc-mingw-w64-x86-64 \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libsdl2-dev

      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh "$GE_TAG" "$WINE_COMMIT"
        env:
          GE_TAG: ${{ needs.check_release.outputs.ge_tag }}
          WINE_COMMIT: ${{ inputs.wine_commit }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_release.outputs.release_tag }}
          name: "${{ needs.check_release.outputs.ge_tag }}-eg (edgemap patched)"
          fail_on_unmatched_files: true
          files: |
            build/${{ needs.check_release.outputs.ge_tag }}-eg.tar.gz
            build/wine-build-${{ needs.check_release.outputs.ge_tag }}/proton-patch.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
